<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta Tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Title -->
    <title>Template</title>

    <!-- Favicon -->
    <link rel="icon" href="assets/favicon.png" type="image/png" />

    <!-- PaperCSS CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/papercss@1.9.2/dist/paper.min.css"
    />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- WOW CSS -->
    <link rel="stylesheet" href="css/animate.css" />

    <!-- FA CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- Header -->
    <div data-component="header"></div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Banner -->
      <div class="row sub-banner">
          <div class="col wow fadeIn">
              <span>
                  I’ve been invited as a Grace Hopper Celebration 2026 speaker and am currently seeking brand sponsorships to support my travel to Anaheim, along with collaborations on DE&I initiatives. 
            <br />
            <a href="https://docs.google.com/document/d/e/2PACX-1vRJl2hLvaqoprYEsSGift_GllyKqqjPiIWFowK4nuKLv8jpdTEtQTGS0eAYlf04BRgV3GuIBtAtPG67/pub">	
              <b><em>Help make my dream a reality.</em></b>
            </a>
              </span>
          </div>
      </div>
      
      <!-- Divider -->
      <div data-component="divider"></div>
    </div>

    <!-- Footer -->
    <div data-component="footer"></div>

    <!-- JQuery JS -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
      integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>

    <!-- WOW JS -->
    <script src="js/wow.min.js"></script>

    <!-- Custom JS -->
    <script src="js/script.js"></script>
  </body>
</html>
